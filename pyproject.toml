[project]
name = "jobscout"
version = "0.1.0"
description = "Hamburg-region full-time job discovery + AI drafting for a non-technical user"
authors = [
    {name = "Izabel Cvetkovic", email = "izabelcvetkovic@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "pydantic (>=2.9,<3.0)",
    "python-dotenv (>=1.0,<2.0)",
    "supabase (>=2.9,<3.0)",
    "anthropic (>=0.40,<0.41)",
    "feedparser (>=6.0,<7.0)",
    "beautifulsoup4 (>=4.12,<5.0)",
    "lxml (>=5.3,<6.0)",
    "httpx (>=0.27,<0.28)",
    "pyyaml (>=6.0,<7.0)",
    "jinja2 (>=3.1,<4.0)",
    "markdown (>=3.7,<4.0)",
    "streamlit (>=1.40,<2.0)",
    "python-jobspy (>=1.1,<2.0)",
    "lingua-language-detector (>=2.0,<3.0)",
    "sentence-transformers (>=3.3,<4.0)",
    "google-genai (>=1.0,<2.0)",
    "playwright (>=1.59.0,<2.0.0)",
    "playwright-stealth (>=2.0.3,<3.0.0)",
    "notify-py (>=0.3,<0.4)",
    "pypdf (>=4.0,<5.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.3,<9.0)",
    "pytest-asyncio (>=0.24,<0.25)",
    "pytest-mock (>=3.14,<4.0)",
    "ruff (>=0.8,<0.9)",
    "mypy (>=1.13,<2.0)",
    "types-pyyaml (>=6.0,<7.0)"
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["feedparser"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["markdown"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jobspy", "pandas"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
