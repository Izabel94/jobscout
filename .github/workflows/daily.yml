name: daily

# Daily cron over the sources jobscout supports:
#   - linkedin   (JobSpy; works logged-out, optional cookie via secret)
#   - indeed     (JobSpy; works logged-out)

on:
  schedule:
    - cron: "50 9 * * *"  # 09:50 UTC = 10:50 / 11:50 Berlin local depending on DST
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [linkedin, indeed]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - run: pipx install poetry
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
          cache: poetry
      - run: poetry install --no-interaction

      - name: Run discover for ${{ matrix.source }}
        env:
          SOURCE: ${{ matrix.source }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_CONTACT_EMAIL: ${{ secrets.SCRAPER_CONTACT_EMAIL }}
          JOBSCOUT_PROFILE_LINKEDIN_URL: ${{ secrets.JOBSCOUT_PROFILE_LINKEDIN_URL }}
        run: poetry run python -m jobscout.discover --only "$SOURCE"

  freshness:
    # Sweep listings whose detail page now says "no longer accepting" /
    # "Projekt nicht mehr aktuell" etc. Flips them to EXPIRED so they
    # don't clog the pipeline. Cheap (HEAD/GET per pipeline listing).
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - run: pipx install poetry
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
          cache: poetry
      - run: poetry install --no-interaction
      - name: Run freshness sweep
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_CONTACT_EMAIL: ${{ secrets.SCRAPER_CONTACT_EMAIL }}
        run: poetry run python -m jobscout.freshness

  filter:
    needs: freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - run: pipx install poetry
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
          cache: poetry
      - run: poetry install --no-interaction
      - name: Run filter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOBSCOUT_PROFILE_LINKEDIN_URL: ${{ secrets.JOBSCOUT_PROFILE_LINKEDIN_URL }}
        run: poetry run python -m jobscout.filter

  score:
    needs: filter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - run: pipx install poetry
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
          cache: poetry
      - run: poetry install --no-interaction
      - name: Run score
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOBSCOUT_PROFILE_LINKEDIN_URL: ${{ secrets.JOBSCOUT_PROFILE_LINKEDIN_URL }}
        run: poetry run python -m jobscout.score

      - name: Run draft
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOBSCOUT_PROFILE_LINKEDIN_URL: ${{ secrets.JOBSCOUT_PROFILE_LINKEDIN_URL }}
        run: poetry run python -m jobscout.draft

      # Print a digest of new high-scoring listings to the GHA log. No
      # email — user opted out. The digest script is still useful locally
      # (e.g. `make digest` would read from cloud Supabase).
      - name: Print digest to GHA log
        if: always()
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTIFY_SCORE_FLOOR: "70"
          NOTIFY_HOURS_BACK: "26"
          UPSTREAM_FAILED: ${{ contains(needs.*.result, 'failure') }}
        run: poetry run python scripts/build_email_digest.py
