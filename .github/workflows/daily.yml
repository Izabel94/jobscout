name: daily

# Daily pipeline over the sources jobscout supports (linkedin, indeed via
# JobSpy). One job runs the whole pipeline sequentially so poetry installs
# once instead of per-stage — the repeated torch+CUDA install was the bulk of
# the Actions minutes.

on:
  schedule:
    - cron: "50 9 * * *"  # 09:50 UTC = 10:50 / 11:50 Berlin local depending on DST
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPER_CONTACT_EMAIL: ${{ secrets.SCRAPER_CONTACT_EMAIL }}
      JOBSCOUT_PROFILE_LINKEDIN_URL: ${{ secrets.JOBSCOUT_PROFILE_LINKEDIN_URL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      # poetry install pulls torch + CUDA wheels (multi-GB). On the stock
      # runner that exhausts the disk; reclaim the unused toolcaches first.
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - run: pipx install poetry
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
          cache: poetry
      - run: poetry install --no-interaction

      # Embedding filter downloads sentence-transformers/all-MiniLM-L6-v2 from
      # HuggingFace; anonymous downloads from the shared runner IP get 429'd.
      # Cache the model; on a cache hit run fully offline (a warm cache alone
      # still pings HF for an etag). HF_TOKEN raises the cold-cache limit.
      - name: Cache HuggingFace model
        id: hfcache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1

      - name: Discover (linkedin + indeed)
        run: poetry run python -m jobscout.discover

      - name: Freshness sweep
        run: poetry run python -m jobscout.freshness

      - name: Filter
        env:
          HF_HUB_OFFLINE: ${{ steps.hfcache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: poetry run python -m jobscout.filter

      - name: Salary
        run: poetry run python -m jobscout.salary

      - name: Score
        run: poetry run python -m jobscout.score

      - name: Draft
        run: poetry run python -m jobscout.draft

      # Digest of new high-scoring listings to the GHA log (no email — user
      # opted out). Runs even if an earlier stage failed.
      - name: Print digest to GHA log
        if: always()
        env:
          PYTHONPATH: .
          NOTIFY_SCORE_FLOOR: "70"
          NOTIFY_HOURS_BACK: "26"
          UPSTREAM_FAILED: ${{ job.status == 'failure' }}
        run: poetry run python scripts/build_email_digest.py
